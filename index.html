<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="svg-container">
      <svg viewBox="0 0 1800 920">
        <!-- 垂直線 -->
        <line class="line" x1="150" y1="0" x2="150" y2="920" stroke="#878787" stroke-width=".5" stroke-opacity=".3"/>
        <line class="line" x1="300" y1="0" x2="300" y2="920" stroke="#878787" stroke-width=".5" stroke-opacity=".3"/>
        <line class="line" x1="450" y1="0" x2="450" y2="920" stroke="#878787" stroke-width=".5" stroke-opacity=".3"/>
        <line class="line" x1="600" y1="0" x2="600" y2="920" stroke="#878787" stroke-width=".5" stroke-opacity=".3"/>
        <line class="line" x1="750" y1="0" x2="750" y2="920" stroke="#878787" stroke-width=".5" stroke-opacity=".3"/>
        <line class="line" x1="900" y1="0" x2="900" y2="920" stroke="#878787" stroke-width=".5" stroke-opacity=".3"/>
        <line class="line" x1="1050" y1="0" x2="1050" y2="920" stroke="#878787" stroke-width=".5" stroke-opacity=".3"/>
        <line class="line" x1="1200" y1="0" x2="1200" y2="920" stroke="#878787" stroke-width=".5" stroke-opacity=".3"/>
        <line class="line" x1="1350" y1="0" x2="1350" y2="920" stroke="#878787" stroke-width=".5" stroke-opacity=".3"/>
        <line class="line" x1="1500" y1="0" x2="1500" y2="920" stroke="#878787" stroke-width=".5" stroke-opacity=".3"/>
        <line class="line" x1="1650" y1="0" x2="1650" y2="920" stroke="#878787" stroke-width=".5" stroke-opacity=".3"/>
        
        <!-- 垂直線濾鏡效果-1 -->
        <line x1="600" y1="450" x2="600" stroke="url(#myGradient)" stroke-width=".5"/>
        <!-- 垂直線濾鏡效果-2 -->
        <line x1="1200" y1="900" x2="1200" stroke="url(#myGradient-2)" stroke-width=".5"/>
        <!-- 垂直線濾鏡效果-3 -->
        <line x1="300" y1="900" x2="300" stroke="url(#myGradient-3)" stroke-width=".5"/>

        <!-- 水平線 -->
        <line class="line" x1="0" y1="150" x2="1800" y2="150" stroke="#878787" stroke-width=".5" stroke-opacity=".3"/>
        <line class="line" x1="0" y1="300" x2="1800" y2="300" stroke="#878787" stroke-width=".5" stroke-opacity=".3"/>
        <line class="line" x1="0" y1="450" x2="1800" y2="450" stroke="#878787" stroke-width=".5" stroke-opacity=".3"/>
        <line class="line" x1="0" y1="600" x2="1800" y2="600" stroke="#878787" stroke-width=".5" stroke-opacity=".3"/>
        <line class="line" x1="0" y1="750" x2="1800" y2="750" stroke="#878787" stroke-width=".5" stroke-opacity=".3"/>
        <line class="line" x1="0" y1="900" x2="1800" y2="900" stroke="#878787" stroke-width=".5" stroke-opacity=".3"/>

        <rect class="rect" fill="#616161" fill-opacity=".04"></rect>
        <rect class="rect" fill="#616161" fill-opacity=".04"></rect>
        <rect class="rect" fill="#616161" fill-opacity=".04"></rect>
        <rect class="rect" fill="#616161" fill-opacity=".04"></rect>
        <rect class="rect" fill="#616161" fill-opacity=".04"></rect>
        <rect class="rect" fill="#616161" fill-opacity=".04"></rect>
        <rect class="rect" fill="#616161" fill-opacity=".04"></rect>

        <defs>
          <!-- 垂直線濾鏡效果設定-1
            效果屬性說明：
            - <defs> 元素用於定義 SVG 文件中的重用元素，例如濾鏡、漸變色等。
            - <radialGradient> 元素用於定義一個放射性漸變色，該漸變色從中心點向外輻射。
            - cx、cy 和 r 屬性分別指定了漸變色的中心點座標和半徑。值得注意的是，這些值都是相對於父元素的座標系統的。
            - gradientUnits 屬性指定了漸變色的單位。設置為 "userSpaceOnUse" 表示漸變色的座標系統是基於使用者空間的。
            - gradientTransform 屬性指定了漸變色的變換矩陣。這裡的變換矩陣包括：
              - translate(100 200): 將漸變色向右移動 100 個單位，向下移動 200 個單位。
              - rotate(90): 將漸變色旋轉 90 度。
              - scale(150 1800): 將漸變色水平方向縮放 150 倍，垂直方向縮放 1800 倍。
            - <stop> 元素用於定義漸變色的顏色停點。這裡定義了兩個停點：
              - 第一個停點：顏色為 #bb2c3e，不透明度為 1。
              - 第二個停點：偏移量為 1（即漸變色的末端），顏色為 #bb2c3e，不透明度為 0。
          -->
          <radialGradient
            id="myGradient" cx="0" cy="0" r="1"
            gradientUnits="userSpaceOnUse"
            gradientTransform="translate(100 200) rotate(90) scale(150 1800)"
          >
            <stop stop-color="#bb2c3e" />
            <stop offset="1" stop-color="#bb2c3e" stop-opacity="0" />
          </radialGradient>

          <!-- 垂直線濾鏡效果設定-2 -->
          <radialGradient
            id="myGradient-2" cx="0" cy="0" r="1"
            gradientUnits="userSpaceOnUse"
            gradientTransform="translate(500 500) rotate(-90) scale(150 1800)"
          >
            <stop stop-color="#bb2c3e" />
            <stop offset="1" stop-color="#bb2c3e" stop-opacity="0" />
          </radialGradient>

          <!-- 垂直線濾鏡效果設定-3 -->
          <radialGradient
            id="myGradient-3" cx="0" cy="0" r="1"
            gradientUnits="userSpaceOnUse"
            gradientTransform="translate(200 500) rotate(45) scale(150 1800)"
          >
            <stop stop-color="#bb2c3e" />
            <stop offset="1" stop-color="#bb2c3e" stop-opacity="0" />
          </radialGradient>
        </defs>
      </svg>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollToPlugin.min.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
